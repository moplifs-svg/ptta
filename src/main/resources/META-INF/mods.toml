modLoader="javafml"
loaderVersion="${loader_version_range}"
license="MIT"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="[${minecraft_version}]"
ordering="NONE"
side="BOTH"

# Plasmo Voice must be present on both sides: the server relays call audio,
# and the client needs it for the voice chat itself.
[[dependencies.${mod_id}]]
modId="plasmovoice"
mandatory=true
versionRange="${plasmovoice_version_range}"
ordering="AFTER"
side="BOTH"
